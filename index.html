<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STARLIGHT VALKYRIE | 星光女武神</title>
  <style>
    :root {
      --bg-deep: #070514;
      --anime-pink: #ff3b9a;
      --anime-cyan: #00f0ff;
      --anime-purple: #a855f7;
      --anime-gold: #ffd700;
      --glass-bg: rgba(15, 11, 38, 0.72);
      --glass-border: rgba(255, 255, 255, 0.16);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      font-family: 'Segoe UI', 'Microsoft JhengHei', system-ui, sans-serif;
      color: var(--text-main);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* 頂部全畫面 HUD 狀態列 */
    .hud-top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .hud-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .char-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      padding: 8px 14px;
      border-radius: 999px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .char-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--anime-pink), var(--anime-purple));
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 900;
      font-size: 0.85rem;
      box-shadow: 0 0 10px var(--anime-pink);
    }

    .hp-bars {
      display: flex;
      gap: 5px;
    }

    .heart {
      color: var(--anime-pink);
      font-size: 1.1rem;
      text-shadow: 0 0 8px var(--anime-pink);
      transition: transform 0.2s, opacity 0.2s;
    }

    .heart.lost {
      opacity: 0.2;
      transform: scale(0.8);
      text-shadow: none;
    }

    /* 必殺技能量條 */
    .ult-bar-wrap {
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 4px 10px;
      width: 190px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ult-label {
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--anime-cyan);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .ult-track {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .ult-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--anime-cyan), var(--anime-pink));
      box-shadow: 0 0 10px var(--anime-cyan);
      transition: width 0.15s ease;
    }

    .hud-right {
      display: flex;
      gap: 10px;
      font-variant-numeric: tabular-nums;
    }

    .stat-pill {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      padding: 6px 14px;
      border-radius: 14px;
      text-align: right;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .stat-label {
      display: block;
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .stat-val {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--anime-cyan);
    }

    .stat-val.lvl { color: var(--anime-gold); }
    .stat-val.best { color: var(--anime-pink); }

    /* 連擊數浮動顯示 */
    .combo-display {
      position: fixed;
      right: 24px;
      top: 86px;
      text-align: right;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.2s, transform 0.2s;
      z-index: 10;
    }

    .combo-display.active {
      opacity: 1;
      transform: scale(1);
    }

    .combo-num {
      font-size: 2rem;
      font-weight: 900;
      font-style: italic;
      background: linear-gradient(180deg, #fff, var(--anime-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
    }

    .combo-text {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--anime-pink);
    }

    /* 升級與警報橫幅 */
    .cutin-banner {
      position: fixed;
      top: 24%;
      left: 0;
      right: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 59, 154, 0.85), rgba(168, 85, 247, 0.85), transparent);
      padding: 12px 0;
      text-align: center;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
      transform: scaleY(0);
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s;
      z-index: 15;
    }

    .cutin-banner.show {
      transform: scaleY(1);
      opacity: 1;
    }

    /* 右下角大招按鈕（手機/滑鼠皆可點） */
    .ult-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: rgba(15, 11, 38, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: not-allowed;
      z-index: 12;
      transition: all 0.2s ease;
    }

    .ult-btn.ready {
      background: radial-gradient(circle, var(--anime-pink), var(--anime-purple));
      border-color: #fff;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 0 25px var(--anime-pink), 0 0 45px rgba(0, 240, 255, 0.4);
      animation: pulseUlt 1.2s infinite;
    }

    @keyframes pulseUlt {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* 全畫面開始與結算面板 */
    .overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(22, 14, 54, 0.82), rgba(7, 5, 20, 0.94));
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 30;
      transition: opacity 0.3s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal-card {
      background: rgba(19, 14, 46, 0.9);
      border: 1.5px solid rgba(255, 59, 154, 0.45);
      border-radius: 28px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 40px rgba(255, 59, 154, 0.2);
    }

    .sub-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--anime-cyan);
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.35);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .modal-card h1 {
      margin: 0 0 8px;
      font-size: 1.9rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fff 10%, var(--anime-pink) 60%, var(--anime-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1.5px;
    }

    .modal-desc {
      margin: 0 0 22px;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .picker-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--anime-gold);
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .lvl-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 10px 6px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .lvl-btn .num {
      display: block;
      font-size: 0.95rem;
      font-weight: 900;
    }

    .lvl-btn .desc {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .lvl-btn:hover {
      border-color: var(--anime-pink);
      transform: translateY(-2px);
    }

    .lvl-btn.active {
      background: linear-gradient(135deg, rgba(255, 59, 154, 0.25), rgba(168, 85, 247, 0.25));
      border-color: var(--anime-pink);
      box-shadow: 0 0 16px rgba(255, 59, 154, 0.4);
    }

    .lvl-btn.active .num {
      color: #fff;
    }

    .lvl-btn.active .desc {
      color: #fbcfe8;
    }

    .btn-launch {
      width: 100%;
      background: linear-gradient(135deg, var(--anime-pink), var(--anime-purple));
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 59, 154, 0.45);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .btn-launch:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(255, 59, 154, 0.65);
    }

    .btn-launch:active {
      transform: scale(0.97);
    }

    .controls-tip {
      margin-top: 16px;
      font-size: 0.76rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- 頂部狀態列 -->
  <div class="hud-top">
    <div class="hud-left">
      <div class="char-badge">
        <div class="char-avatar">★</div>
        <div class="hp-bars" id="hpBars">
          <span class="heart">♥</span>
          <span class="heart">♥</span>
          <span class="heart">♥</span>
          <span class="heart">♥</span>
          <span class="heart">♥</span>
        </div>
      </div>
      <div class="ult-bar-wrap">
        <span class="ult-label">STAR BURST</span>
        <div class="ult-track">
          <div class="ult-fill" id="ultFill"></div>
        </div>
      </div>
    </div>

    <div class="hud-right">
      <div class="stat-pill">
        <span class="stat-label">STAGE</span>
        <span class="stat-val lvl" id="levelDisplay">LV 1</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">SCORE</span>
        <span class="stat-val" id="scoreDisplay">0</span>
      </div>
      <div class="stat-pill">
        <span class="stat-label">BEST</span>
        <span class="stat-val best" id="bestDisplay">0</span>
      </div>
    </div>
  </div>

  <!-- 連擊提示 -->
  <div class="combo-display" id="comboBox">
    <div class="combo-num" id="comboNum">0</div>
    <div class="combo-text">COMBO HIT</div>
  </div>

  <!-- 動漫風格過場橫幅 -->
  <div class="cutin-banner" id="cutinBanner">STAGE UP! 星光火力解放</div>

  <!-- 右下角必殺技按鈕 -->
  <button class="ult-btn" id="ultBtn" title="空白鍵或點擊釋放星爆大招">
    <span>STAR</span>
    <span>BURST</span>
  </button>

  <!-- 全畫面遊戲畫布 -->
  <canvas id="gameCanvas"></canvas>

  <!-- 開始 / 結算全畫面覆蓋層 -->
  <div class="overlay" id="overlay">
    <div class="modal-card">
      <div class="sub-tag">ANIME BULLET SHOOTER</div>
      <h1 id="modalTitle">星光女武神</h1>
      <p class="modal-desc" id="modalDesc">
        駕馭星辰魔導翼擊破暗影機甲！<br>
        每得 500 分自動晉級，火力與敵軍速度同步提升
      </p>

      <div class="picker-title">選擇出擊關卡（速度與彈幕難度）</div>
      <div class="level-grid" id="levelGrid">
        <button type="button" class="lvl-btn active" data-lvl="1">
          <span class="num">STAGE 1</span>
          <span class="desc">星屑巡航 · 慢速</span>
        </button>
        <button type="button" class="lvl-btn" data-lvl="2">
          <span class="num">STAGE 2</span>
          <span class="desc">流光疾風 · 輕快</span>
        </button>
        <button type="button" class="lvl-btn" data-lvl="3">
          <span class="num">STAGE 3</span>
          <span class="desc">蒼穹交鋒 · 中速</span>
        </button>
        <button type="button" class="lvl-btn" data-lvl="4">
          <span class="num">STAGE 4</span>
          <span class="desc">緋紅彈幕 · 高速</span>
        </button>
        <button type="button" class="lvl-btn" data-lvl="5">
          <span class="num">STAGE 5</span>
          <span class="desc">超新星域 · 極速</span>
        </button>
        <button type="button" class="lvl-btn" data-lvl="6">
          <span class="num">STAGE 6</span>
          <span class="desc">終焉神域 · 狂暴</span>
        </button>
      </div>

      <button class="btn-launch" id="startBtn">全速出擊</button>
      <div class="controls-tip">滑鼠 / 觸控拖曳移動（自動射擊） · 空白鍵 / 右下按鈕釋放全屏大招</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const levelDisplay = document.getElementById('levelDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const bestDisplay = document.getElementById('bestDisplay');
    const hpBars = document.getElementById('hpBars').children;
    const ultFill = document.getElementById('ultFill');
    const ultBtn = document.getElementById('ultBtn');
    const comboBox = document.getElementById('comboBox');
    const comboNum = document.getElementById('comboNum');
    const cutinBanner = document.getElementById('cutinBanner');
    const overlay = document.getElementById('overlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const startBtn = document.getElementById('startBtn');
    const lvlButtons = document.querySelectorAll('.lvl-btn');

    const STORAGE_KEY = 'starlight_valkyrie_best';
    let bestScore = Number(localStorage.getItem(STORAGE_KEY)) || 0;
    bestDisplay.textContent = bestScore;

    // 響應式全畫面調整
    let W = window.innerWidth;
    let H = window.innerHeight;
    function resizeCanvas() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 關卡參數設定（從慢速漸進到極速彈幕）
    const STAGE_CONFIGS = [
      { enemySpeed: 2.2, spawnRate: 62, shootChance: 0.004, bulletSpeed: 3.4, spread: 1, theme: '#00f0ff' },
      { enemySpeed: 2.9, spawnRate: 50, shootChance: 0.007, bulletSpeed: 4.1, spread: 2, theme: '#38bdf8' },
      { enemySpeed: 3.6, spawnRate: 40, shootChance: 0.011, bulletSpeed: 4.8, spread: 2, theme: '#a855f7' },
      { enemySpeed: 4.4, spawnRate: 32, shootChance: 0.015, bulletSpeed: 5.5, spread: 3, theme: '#f43f5e' },
      { enemySpeed: 5.2, spawnRate: 25, shootChance: 0.020, bulletSpeed: 6.3, spread: 3, theme: '#f59e0b' },
      { enemySpeed: 6.1, spawnRate: 19, shootChance: 0.026, bulletSpeed: 7.2, spread: 4, theme: '#ff3b9a' }
    ];

    let selectedStartStage = 1;
    let currentStage = 1;
    let score = 0;
    let combo = 0;
    let comboTimer = 0;
    let ultEnergy = 0;
    let isRunning = false;
    let frameCount = 0;
    let bannerTimeout = null;
    let screenShake = 0;

    // 玩家女武神狀態
    const player = {
      x: W / 2,
      y: H * 0.8,
      targetX: W / 2,
      targetY: H * 0.8,
      radius: 16,
      hp: 5,
      maxHp: 5,
      invuln: 0,
      fireCooldown: 0
    };

    let stars = [];
    let petals = [];
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let shockwaves = [];

    // 初始化星空與櫻花光塵背景
    function initBackground() {
      stars = Array.from({ length: 90 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2.2 + 0.5,
        speed: Math.random() * 2.5 + 0.5,
        alpha: Math.random() * 0.8 + 0.2
      }));
      petals = Array.from({ length: 22 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 5 + 3,
        speedY: Math.random() * 1.5 + 0.8,
        speedX: (Math.random() - 0.5) * 1.2,
        rot: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.05
      }));
    }
    initBackground();

    function getStageCfg(stage) {
      return STAGE_CONFIGS[Math.min(stage - 1, STAGE_CONFIGS.length - 1)];
    }

    function showBanner(text) {
      clearTimeout(bannerTimeout);
      cutinBanner.textContent = text;
      cutinBanner.classList.add('show');
      bannerTimeout = setTimeout(() => {
        cutinBanner.classList.remove('show');
      }, 1600);
    }

    function updateHUD() {
      levelDisplay.textContent = `LV ${currentStage}`;
      scoreDisplay.textContent = score;
      for (let i = 0; i < player.maxHp; i++) {
        hpBars[i].classList.toggle('lost', i >= player.hp);
      }
      ultFill.style.width = `${ultEnergy}%`;
      ultBtn.classList.toggle('ready', ultEnergy >= 100);

      if (combo > 1) {
        comboBox.classList.add('active');
        comboNum.textContent = combo;
      } else {
        comboBox.classList.remove('active');
      }
    }

    // 關卡選擇按鈕事件
    lvlButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        lvlButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedStartStage = Number(btn.dataset.lvl);
        currentStage = selectedStartStage;
        levelDisplay.textContent = `LV ${currentStage}`;
      });
    });

    function startGame() {
      score = 0;
      combo = 0;
      ultEnergy = 40; // 開場贈送 40% 能量
      currentStage = selectedStartStage;
      frameCount = 0;
      screenShake = 0;

      player.x = W / 2;
      player.y = H * 0.82;
      player.targetX = player.x;
      player.targetY = player.y;
      player.hp = player.maxHp;
      player.invuln = 60;

      bullets = [];
      enemyBullets = [];
      enemies = [];
      particles = [];
      shockwaves = [];

      isRunning = true;
      overlay.classList.add('hidden');
      updateHUD();
      showBanner(`STAGE ${currentStage} · STARLIGHT ENGAGE!`);
    }

    function endGame() {
      isRunning = false;
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem(STORAGE_KEY, bestScore);
        bestDisplay.textContent = bestScore;
      }
      modalTitle.textContent = 'MISSION COMPLETE';
      modalDesc.innerHTML = `最終抵達：<strong>STAGE ${currentStage}</strong><br>戰鬥總分：<strong>${score}</strong> 分（最高紀錄 ${bestScore} 分）`;
      startBtn.textContent = '再次出擊';
      overlay.classList.remove('hidden');
    }

    // 釋放全畫面星爆大招 (STAR BURST)
    function triggerStarBurst() {
      if (!isRunning || ultEnergy < 100) return;
      ultEnergy = 0;
      screenShake = 18;
      showBanner('★ STARLIGHT OVERDRIVE ★');

      // 產生全屏光環衝擊波
      shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: Math.max(W, H), alpha: 1 });

      // 清除所有敵方子彈並轉化為分數
      enemyBullets.forEach(b => {
        spawnParticles(b.x, b.y, '#00f0ff', 4);
        score += 5;
      });
      enemyBullets = [];

      // 對場上所有敵機造成巨量傷害
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.hp -= 12;
        spawnParticles(e.x, e.y, '#ff3b9a', 14);
        if (e.hp <= 0) {
          addScore(e.points);
          enemies.splice(i, 1);
        }
      }
      updateHUD();
    }

    ultBtn.addEventListener('click', triggerStarBurst);

    function addScore(basePoints) {
      combo++;
      comboTimer = 150; // 約 2.5 秒內連殺維持 Combo
      const multiplier = 1 + Math.min(Math.floor(combo / 10) * 0.2, 2.0);
      score += Math.round(basePoints * multiplier);

      // 每 500 分自動升級關卡
      const nextStage = selectedStartStage + Math.floor(score / 500);
      if (nextStage > currentStage) {
        currentStage = nextStage;
        showBanner(`STAGE ${currentStage} · 火力與速度升級！`);
      }
      updateHUD();
    }

    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4.5 + 1;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3.5 + 1.5,
          color,
          life: 1,
          decay: Math.random() * 0.03 + 0.02
        });
      }
    }

    function spawnEnemy() {
      const cfg = getStageCfg(currentStage);
      const roll = Math.random();
      let type = 'fairy'; // 預設暗影精靈機
      let radius = 18;
      let hp = 2 + Math.floor(currentStage * 0.6);
      let points = 30;
      let color = '#a855f7';
      let speedY = cfg.enemySpeed * (0.9 + Math.random() * 0.3);

      if (roll > 0.84) {
        // 精英魔導機甲（血厚、會發射扇形彈幕）
        type = 'valkyrie_dark';
        radius = 28;
        hp = 8 + currentStage * 2;
        points = 120;
        color = '#ff3b9a';
        speedY = cfg.enemySpeed * 0.65;
      } else if (roll > 0.62) {
        // 高速突襲機（左右搖擺移動）
        type = 'striker';
        radius = 16;
        hp = 2 + Math.floor(currentStage * 0.4);
        points = 50;
        color = '#00f0ff';
        speedY = cfg.enemySpeed * 1.25;
      }

      enemies.push({
        type,
        x: Math.random() * (W - 80) + 40,
        y: -40,
        baseX: 0,
        radius,
        hp,
        maxHp: hp,
        points,
        color,
        speedY,
        phase: Math.random() * Math.PI * 2
      });
    }

    function firePlayerBullets() {
      const cfg = getStageCfg(currentStage);
      const spread = cfg.spread;
      const speed = -11;

      if (spread === 1) {
        bullets.push({ x: player.x, y: player.y - 20, vx: 0, vy: speed, color: '#00f0ff', dmg: 1.5 });
      } else if (spread === 2) {
        bullets.push({ x: player.x - 10, y: player.y - 16, vx: 0, vy: speed, color: '#00f0ff', dmg: 1.4 });
        bullets.push({ x: player.x + 10, y: player.y - 16, vx: 0, vy: speed, color: '#00f0ff', dmg: 1.4 });
      } else if (spread === 3) {
        bullets.push({ x: player.x, y: player.y - 22, vx: 0, vy: speed, color: '#ff3b9a', dmg: 1.6 });
        bullets.push({ x: player.x - 14, y: player.y - 14, vx: -1.4, vy: speed * 0.98, color: '#00f0ff', dmg: 1.3 });
        bullets.push({ x: player.x + 14, y: player.y - 14, vx: 1.4, vy: speed * 0.98, color: '#00f0ff', dmg: 1.3 });
      } else {
        // 狂暴 4 道星光彈幕
        [-18, -6, 6, 18].forEach((offset, idx) => {
          bullets.push({
            x: player.x + offset,
            y: player.y - 16,
            vx: (idx - 1.5) * 0.85,
            vy: speed,
            color: idx === 1 || idx === 2 ? '#ffd700' : '#ff3b9a',
            dmg: 1.5
          });
        });
      }
    }

    // 繪製動漫風格星光女武神機體（帶雙馬尾流光與魔法星翼）
    function drawAnimePlayer(x, y) {
      ctx.save();
      ctx.translate(x, y);

      if (player.invuln > 0 && Math.floor(frameCount / 4) % 2 === 0) {
        ctx.globalAlpha = 0.45;
      }

      const cfg = getStageCfg(currentStage);

      // 背後展開的發光魔法星翼
      ctx.shadowColor = cfg.theme;
      ctx.shadowBlur = 18;
      ctx.fillStyle = 'rgba(0, 240, 255, 0.28)';
      ctx.beginPath();
      ctx.moveTo(0, -4);
      ctx.lineTo(-34, 14);
      ctx.lineTo(-18, 22);
      ctx.lineTo(0, 10);
      ctx.lineTo(18, 22);
      ctx.lineTo(34, 14);
      ctx.closePath();
      ctx.fill();

      // 雙馬尾飄動光帶
      const sway = Math.sin(frameCount * 0.15) * 5;
      ctx.strokeStyle = '#ff3b9a';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-7, -6);
      ctx.quadraticCurveTo(-18, 8, -14 + sway, 24);
      ctx.moveTo(7, -6);
      ctx.quadraticCurveTo(18, 8, 14 + sway, 24);
      ctx.stroke();

      // 機體核心（鑽石星辰裝甲）
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(0, -22);
      ctx.lineTo(12, 8);
      ctx.lineTo(0, 16);
      ctx.lineTo(-12, 8);
      ctx.closePath();
      ctx.fill();

      // 胸口粉紅星光核心
      ctx.fillStyle = '#ff3b9a';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();

      // 引擎推進尾焰
      ctx.fillStyle = '#00f0ff';
      ctx.beginPath();
      ctx.moveTo(-5, 16);
      ctx.lineTo(0, 26 + Math.random() * 8);
      ctx.lineTo(5, 16);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    // 繪製敵機（動漫幾何魔導造型）
    function drawEnemy(e) {
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.shadowColor = e.color;
      ctx.shadowBlur = 14;

      if (e.type === 'valkyrie_dark') {
        // 精英暗影女武神 Boss 機
        ctx.fillStyle = '#1e1035';
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, e.radius);
        ctx.lineTo(e.radius * 1.3, -e.radius * 0.4);
        ctx.lineTo(e.radius * 0.5, -e.radius);
        ctx.lineTo(0, -e.radius * 0.5);
        ctx.lineTo(-e.radius * 0.5, -e.radius);
        ctx.lineTo(-e.radius * 1.3, -e.radius * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 血條
        const hpRatio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(-22, -e.radius - 10, 44, 4);
        ctx.fillStyle = '#ff3b9a';
        ctx.fillRect(-22, -e.radius - 10, 44 * hpRatio, 4);
      } else {
        // 一般暗影無人機
        ctx.fillStyle = e.color;
        ctx.beginPath();
        ctx.moveTo(0, e.radius);
        ctx.lineTo(e.radius, -e.radius * 0.6);
        ctx.lineTo(0, -e.radius * 0.2);
        ctx.lineTo(-e.radius, -e.radius * 0.6);
        ctx.closePath();
        ctx.fill();
      }

      // 敵機發光瞳孔核心
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 0, e.radius * 0.24, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function updateAndDraw() {
      ctx.save();

      // 畫面震動效果
      if (screenShake > 0) {
        const sx = (Math.random() - 0.5) * screenShake;
        const sy = (Math.random() - 0.5) * screenShake;
        ctx.translate(sx, sy);
        screenShake *= 0.88;
        if (screenShake < 0.5) screenShake = 0;
      }

      // 深空漸層背景
      const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#070514');
      bgGrad.addColorStop(0.5, '#0f0a29');
      bgGrad.addColorStop(1, '#180d38');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      const cfg = getStageCfg(currentStage);
      const speedMult = isRunning ? (0.8 + currentStage * 0.25) : 0.6;

      // 繪製背景流光星點
      stars.forEach(s => {
        s.y += s.speed * speedMult;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha})`;
        ctx.fillRect(s.x, s.y, s.size, s.size * (1 + speedMult * 0.8));
      });

      // 繪製動漫櫻花光瓣
      petals.forEach(p => {
        p.y += p.speedY * speedMult;
        p.x += p.speedX + Math.sin(frameCount * 0.02 + p.rot) * 0.5;
        p.rot += p.rotSpeed;
        if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = 'rgba(255, 110, 180, 0.35)';
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      if (isRunning) {
        frameCount++;

        // 連擊計時倒數
        if (comboTimer > 0) {
          comboTimer--;
          if (comboTimer === 0) {
            combo = 0;
            updateHUD();
          }
        }

        // 平滑移動玩家位置
        player.x += (player.targetX - player.x) * 0.22;
        player.y += (player.targetY - player.y) * 0.22;
        player.x = Math.max(24, Math.min(W - 24, player.x));
        player.y = Math.max(60, Math.min(H - 24, player.y));

        if (player.invuln > 0) player.invuln--;

        // 自動射擊星光彈
        if (player.fireCooldown <= 0) {
          firePlayerBullets();
          player.fireCooldown = Math.max(6, 11 - currentStage);
        } else {
          player.fireCooldown--;
        }

        // 生成敵機
        if (frameCount % cfg.spawnRate === 0) {
          spawnEnemy();
        }
      }

      // 更新與繪製大招光環衝擊波
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 26;
        sw.alpha -= 0.028;
        if (sw.alpha <= 0) {
          shockwaves.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.strokeStyle = `rgba(0, 240, 255, ${sw.alpha})`;
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 更新與繪製玩家星光彈
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.y < -20) {
          bullets.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.shadowColor = b.color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.roundRect(b.x - 2.5, b.y - 10, 5, 18, 3);
        ctx.fill();
        ctx.restore();
      }

      // 更新與繪製敵機
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speedY;
        if (e.type === 'striker') {
          e.x += Math.sin(frameCount * 0.06 + e.phase) * 2.8;
        }

        // 敵機發射彈幕
        if (isRunning && e.y > 40 && e.y < H * 0.7 && Math.random() < cfg.shootChance) {
          const angle = Math.atan2(player.y - e.y, player.x - e.x);
          if (e.type === 'valkyrie_dark') {
            // 精英機發射 3 向扇形彈
            [-0.25, 0, 0.25].forEach(offset => {
              enemyBullets.push({
                x: e.x,
                y: e.y + 10,
                vx: Math.cos(angle + offset) * cfg.bulletSpeed,
                vy: Math.sin(angle + offset) * cfg.bulletSpeed
              });
            });
          } else {
            enemyBullets.push({
              x: e.x,
              y: e.y + 10,
              vx: Math.cos(angle) * cfg.bulletSpeed,
              vy: Math.sin(angle) * cfg.bulletSpeed
            });
          }
        }

        // 檢查玩家子彈擊中敵機
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          const dist = Math.hypot(b.x - e.x, b.y - e.y);
          if (dist < e.radius + 8) {
            e.hp -= b.dmg;
            spawnParticles(b.x, b.y, b.color, 4);
            bullets.splice(j, 1);

            if (e.hp <= 0) {
              spawnParticles(e.x, e.y, e.color, 16);
              ultEnergy = Math.min(100, ultEnergy + (e.type === 'valkyrie_dark' ? 18 : 7));
              addScore(e.points);
              enemies.splice(i, 1);
            }
            break;
          }
        }

        if (!enemies[i]) continue;

        // 檢查敵機撞擊玩家
        if (isRunning && player.invuln <= 0) {
          const pDist = Math.hypot(player.x - e.x, player.y - e.y);
          if (pDist < player.radius + e.radius - 4) {
            enemies.splice(i, 1);
            damagePlayer();
            continue;
          }
        }

        if (e.y > H + 50) {
          enemies.splice(i, 1);
          continue;
        }

        drawEnemy(e);
      }

      // 更新與繪製敵方彈幕
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;

        if (eb.y > H + 20 || eb.x < -20 || eb.x > W + 20) {
          enemyBullets.splice(i, 1);
          continue;
        }

        if (isRunning && player.invuln <= 0) {
          const dist = Math.hypot(eb.x - player.x, eb.y - player.y);
          if (dist < player.radius - 3) {
            enemyBullets.splice(i, 1);
            damagePlayer();
            continue;
          }
        }

        ctx.save();
        ctx.shadowColor = '#ff2a85';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ff2a85';
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(eb.x, eb.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 更新與繪製爆炸星塵粒子
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= pt.decay;
        if (pt.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.globalAlpha = pt.life;
        ctx.fillStyle = pt.color;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // 繪製玩家女武神
      drawAnimePlayer(player.x, player.y);

      ctx.restore();
      requestAnimationFrame(updateAndDraw);
    }

    function damagePlayer() {
      player.hp--;
      player.invuln = 75;
      combo = 0;
      screenShake = 14;
      spawnParticles(player.x, player.y, '#ff3b9a', 22);
      updateHUD();
      if (player.hp <= 0) {
        endGame();
      }
    }

    // 滑鼠移動控制
    window.addEventListener('mousemove', (e) => {
      if (!isRunning) return;
      player.targetX = e.clientX;
      player.targetY = e.clientY;
    });

    // 觸控拖曳控制
    window.addEventListener('touchmove', (e) => {
      if (!isRunning) return;
      e.preventDefault();
      const touch = e.touches[0];
      player.targetX = touch.clientX;
      player.targetY = touch.clientY - 35; // 稍微上移避免手指遮住角色
    }, { passive: false });

    // 鍵盤移動與大招
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space' || e.code === 'KeyX') {
        if (isRunning) triggerStarBurst();
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    setInterval(() => {
      if (!isRunning) return;
      const moveSpeed = 9;
      if (keys['ArrowLeft'] || keys['KeyA']) player.targetX -= moveSpeed;
      if (keys['ArrowRight'] || keys['KeyD']) player.targetX += moveSpeed;
      if (keys['ArrowUp'] || keys['KeyW']) player.targetY -= moveSpeed;
      if (keys['ArrowDown'] || keys['KeyS']) player.targetY += moveSpeed;
    }, 16);

    startBtn.addEventListener('click', startGame);

    // 啟動背景動畫循環
    requestAnimationFrame(updateAndDraw);
  </script>
</body>
</html>
