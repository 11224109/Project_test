<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON SNAKE | 自選關卡版</title>
  <style>
    :root {
      --bg-color: #0d0f1a;
      --cabinet-bg: #16192b;
      --screen-bg: #080a12;
      --neon-green: #00ff88;
      --neon-pink: #ff2a85;
      --neon-blue: #00d4ff;
      --neon-gold: #ffe600;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #1e2442 0%, var(--bg-color) 70%);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .arcade-cabinet {
      background: var(--cabinet-bg);
      border: 2px solid #2a3052;
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 212, 255, 0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 8px;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--neon-blue);
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }

    .speed-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .scoreboard {
      display: flex;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }

    .score-box {
      background: var(--screen-bg);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #252b48;
      text-align: right;
      min-width: 56px;
    }

    .score-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      display: block;
    }

    .score-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--neon-green);
    }

    .score-value.level {
      color: var(--neon-gold);
    }

    .score-value.high {
      color: var(--neon-pink);
    }

    .screen-wrapper {
      position: relative;
      background: var(--screen-bg);
      border-radius: 14px;
      border: 2px solid #283054;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .level-banner {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(22, 25, 43, 0.92);
      border: 1px solid var(--neon-gold);
      color: var(--neon-gold);
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: 0 0 18px rgba(255, 230, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .level-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 10, 18, 0.88);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 18px;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay h2 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      color: var(--neon-pink);
      text-shadow: 0 0 12px rgba(255, 42, 133, 0.6);
    }

    .overlay p {
      margin: 0 0 14px;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    /* 關卡選擇器樣式 */
    .level-picker-label {
      font-size: 0.75rem;
      color: var(--neon-blue);
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 280px;
      margin-bottom: 18px;
    }

    .lvl-btn {
      background: #1a1f36;
      border: 1.5px solid #2e365c;
      border-radius: 10px;
      padding: 7px 4px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.15s ease;
    }

    .lvl-btn .lvl-num {
      font-size: 0.85rem;
      font-weight: 800;
    }

    .lvl-btn .lvl-desc {
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .lvl-btn:hover {
      border-color: var(--neon-blue);
    }

    .lvl-btn.active {
      background: rgba(0, 212, 255, 0.15);
      border-color: var(--neon-blue);
      box-shadow: 0 0 12px rgba(0, 212, 255, 0.35);
    }

    .lvl-btn.active .lvl-num {
      color: var(--neon-blue);
    }

    .lvl-btn.active .lvl-desc {
      color: #cbd5e1;
    }

    .btn-start {
      background: linear-gradient(135deg, var(--neon-blue), #0077ff);
      color: #fff;
      border: none;
      padding: 11px 30px;
      font-size: 0.98rem;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
      transition: transform 0.1s ease;
    }

    .btn-start:active {
      transform: scale(0.95);
    }

    .controls {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 54px);
      gap: 8px;
      justify-content: center;
    }

    .d-btn {
      background: #212642;
      border: 1px solid #323a63;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #121526;
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .d-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #121526;
      background: #2c3357;
    }

    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }

    .hint {
      text-align: center;
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="arcade-cabinet">
    <div class="header">
      <div class="title-group">
        <div class="title">NEON SNAKE</div>
        <div class="speed-tag" id="speedTag">速度：慢速 (1.0x)</div>
      </div>
      <div class="scoreboard">
        <div class="score-box">
          <span class="score-label">LEVEL</span>
          <span class="score-value level" id="level">1</span>
        </div>
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">BEST</span>
          <span class="score-value high" id="highScore">0</span>
        </div>
      </div>
    </div>

    <div class="screen-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="level-banner" id="levelBanner">LEVEL UP! 速度提升</div>
      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">NEON SNAKE</h2>
        <p id="overlayDesc">選擇起始關卡，每得 50 分繼續晉級！</p>

        <div class="level-picker-label">選擇起始關卡</div>
        <div class="level-grid" id="levelGrid">
          <button type="button" class="lvl-btn active" data-lvl="1">
            <span class="lvl-num">LV 1</span>
            <span class="lvl-desc">慢速 1.0x</span>
          </button>
          <button type="button" class="lvl-btn" data-lvl="2">
            <span class="lvl-num">LV 2</span>
            <span class="lvl-desc">輕快 1.2x</span>
          </button>
          <button type="button" class="lvl-btn" data-lvl="3">
            <span class="lvl-num">LV 3</span>
            <span class="lvl-desc">中速 1.5x</span>
          </button>
          <button type="button" class="lvl-btn" data-lvl="4">
            <span class="lvl-num">LV 4</span>
            <span class="lvl-desc">高速 1.8x</span>
          </button>
          <button type="button" class="lvl-btn" data-lvl="5">
            <span class="lvl-num">LV 5</span>
            <span class="lvl-desc">極速 2.3x</span>
          </button>
          <button type="button" class="lvl-btn" data-lvl="6">
            <span class="lvl-num">LV 6</span>
            <span class="lvl-desc">狂暴 2.9x</span>
          </button>
        </div>

        <button class="btn-start" id="startBtn">開始挑戰</button>
      </div>
    </div>

    <div class="controls">
      <button class="d-btn d-up" data-dir="UP" aria-label="上">▲</button>
      <button class="d-btn d-left" data-dir="LEFT" aria-label="左">◀</button>
      <button class="d-btn d-down" data-dir="DOWN" aria-label="下">▼</button>
      <button class="d-btn d-right" data-dir="RIGHT" aria-label="右">▶</button>
    </div>

    <div class="hint">方向鍵 / WASD 控制移動 · 空白鍵暫停</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const levelEl = document.getElementById('level');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const speedTagEl = document.getElementById('speedTag');
    const levelBanner = document.getElementById('levelBanner');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtn = document.getElementById('startBtn');
    const lvlButtons = document.querySelectorAll('.lvl-btn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;
    const STORAGE_KEY = 'neon_snake_best_score';

    const LEVEL_THEMES = [
      { speed: 160, label: '慢速 (1.0x)', head: '#00ff88', body1: '#00cc6d', body2: '#00b35f' },
      { speed: 135, label: '輕快 (1.2x)', head: '#00d4ff', body1: '#00a8cc', body2: '#0091b3' },
      { speed: 110, label: '中速 (1.5x)', head: '#c77dff', body1: '#9d4edd', body2: '#7b2cbf' },
      { speed: 88,  label: '高速 (1.8x)', head: '#ff9e00', body1: '#ff7b00', body2: '#e85d04' },
      { speed: 70,  label: '極速 (2.3x)', head: '#ffe600', body1: '#ffd000', body2: '#ffb703' },
      { speed: 55,  label: '狂暴 (2.9x)', head: '#ff2a85', body1: '#e01e70', body2: '#c9184a' }
    ];

    let snake = [];
    let food = { x: 10, y: 10 };
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
    let score = 0;
    let selectedStartLevel = 1;
    let level = 1;
    let highScore = Number(localStorage.getItem(STORAGE_KEY)) || 0;
    let gameLoop = null;
    let bannerTimer = null;
    let isRunning = false;
    let isPaused = false;

    highScoreEl.textContent = highScore;

    function getLevelConfig(lvl) {
      const index = Math.min(lvl - 1, LEVEL_THEMES.length - 1);
      return LEVEL_THEMES[index];
    }

    function updateLevelUI() {
      const cfg = getLevelConfig(level);
      levelEl.textContent = level;
      speedTagEl.textContent = `速度：${cfg.label}`;
    }

    function showLevelUpBanner(newLevel) {
      clearTimeout(bannerTimer);
      levelBanner.textContent = `LEVEL ${newLevel} · 速度提升！`;
      levelBanner.classList.add('show');
      bannerTimer = setTimeout(() => {
        levelBanner.classList.remove('show');
      }, 1500);
    }

    // 關卡選擇按鈕點擊事件
    lvlButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        lvlButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedStartLevel = Number(btn.dataset.lvl);
        level = selectedStartLevel;
        updateLevelUI();
        draw(); // 即時預覽該關卡蛇身顏色
      });
    });

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      level = selectedStartLevel;
      isPaused = false;
      scoreEl.textContent = score;
      levelBanner.classList.remove('show');
      updateLevelUI();
      spawnFood();
    }

    function spawnFood() {
      while (true) {
        food = {
          x: Math.floor(Math.random() * TILE_COUNT),
          y: Math.floor(Math.random() * TILE_COUNT)
        };
        const onSnake = snake.some(part => part.x === food.x && part.y === food.y);
        if (!onSnake) break;
      }
    }

    function startLoopWithCurrentSpeed() {
      clearInterval(gameLoop);
      const cfg = getLevelConfig(level);
      gameLoop = setInterval(tick, cfg.speed);
    }

    function startGame() {
      initGame();
      isRunning = true;
      overlay.classList.add('hidden');
      startLoopWithCurrentSpeed();
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(STORAGE_KEY, highScore);
        highScoreEl.textContent = highScore;
      }
      overlayTitle.textContent = 'GAME OVER';
      overlayDesc.innerHTML = `抵達關卡：<strong>LEVEL ${level}</strong> · 得分：<strong>${score}</strong> 分`;
      startBtn.textContent = '再挑戰一次';
      overlay.classList.remove('hidden');
    }

    function tick() {
      if (isPaused) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        return gameOver();
      }

      if (snake.some(part => part.x === head.x && part.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        spawnFood();

        // 以選擇的起始關卡為基準，每 50 分往上升一關
        const calculatedLevel = selectedStartLevel + Math.floor(score / 50);
        if (calculatedLevel > level) {
          level = calculatedLevel;
          updateLevelUI();
          showLevelUpBanner(level);
          startLoopWithCurrentSpeed();
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      const cfg = getLevelConfig(level);

      ctx.fillStyle = '#080a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      ctx.save();
      ctx.shadowColor = '#ff2a85';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ff2a85';
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2.4,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.restore();

      snake.forEach((part, index) => {
        const isHead = index === 0;
        ctx.save();
        if (isHead) {
          ctx.shadowColor = cfg.head;
          ctx.shadowBlur = 10;
          ctx.fillStyle = cfg.head;
        } else {
          ctx.fillStyle = index % 2 === 0 ? cfg.body1 : cfg.body2;
        }
        ctx.beginPath();
        ctx.roundRect(
          part.x * GRID_SIZE + 1.5,
          part.y * GRID_SIZE + 1.5,
          GRID_SIZE - 3,
          GRID_SIZE - 3,
          isHead ? 6 : 4
        );
        ctx.fill();
        ctx.restore();
      });
    }

    function setDirection(dir) {
      if (!isRunning || isPaused) return;
      if (dir === 'UP' && dy !== 1) { nextDx = 0; nextDy = -1; }
      if (dir === 'DOWN' && dy !== -1) { nextDx = 0; nextDy = 1; }
      if (dir === 'LEFT' && dx !== 1) { nextDx = -1; nextDy = 0; }
      if (dir === 'RIGHT' && dx !== -1) { nextDx = 1; nextDy = 0; }
    }

    document.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') setDirection('UP');
      if (e.code === 'ArrowDown' || e.code === 'KeyS') setDirection('DOWN');
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') setDirection('LEFT');
      if (e.code === 'ArrowRight' || e.code === 'KeyD') setDirection('RIGHT');
      if (e.code === 'Space') {
        if (!isRunning) {
          startGame();
        } else {
          isPaused = !isPaused;
        }
      }
    });

    document.querySelectorAll('.d-btn').forEach(btn => {
      btn.addEventListener('click', () => setDirection(btn.dataset.dir));
    });

    startBtn.addEventListener('click', startGame);

    initGame();
    draw();
  </script>
</body>
</html>
