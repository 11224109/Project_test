<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GOMOKU MULTI-LINE | 多線五子棋對戰</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --board-wood: #deb887;
      --board-border: #8b5a2b;
      --accent-cyan: #38bdf8;
      --accent-gold: #fbbf24;
      --accent-pink: #f43f5e;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 80%);
      color: var(--text-main);
      font-family: 'Segoe UI', 'Microsoft JhengHei', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
    }

    .app-container {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 330px 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 840px) {
      .app-container {
        grid-template-columns: 1fr;
        max-width: 540px;
      }
    }

    .sidebar {
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .brand {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--accent-cyan);
    }

    .rule-badge {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.4);
      color: var(--accent-gold);
      font-size: 0.74rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 999px;
    }

    .mode-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px;
      border-radius: 12px;
    }

    .mode-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 9px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-tab.active {
      background: var(--accent-cyan);
      color: #0f172a;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.35);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    select, input[type="text"] {
      width: 100%;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.86rem;
      outline: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-cyan);
    }

    select:disabled, input:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

      background: rgba
