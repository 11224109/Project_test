<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BOARD GAME ARENA | 多款棋類對戰大廳</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app-container">
    <!-- 左側設定與開房面板 -->
    <aside class="sidebar">
      <div class="brand">
        <h1>多款棋類對戰大廳</h1>
        <span class="rule-badge" id="ruleBadge">五子棋</span>
      </div>

      <div class="control-group">
        <label>選擇棋類遊戲</label>
        <div class="game-grid" id="gameGrid">
          <button type="button" class="game-btn active" data-game="gomoku">五子棋 (多線)</button>
          <button type="button" class="game-btn" data-game="tictactoe">井字棋 (3×3)</button>
          <button type="button" class="game-btn" data-game="othello">黑白棋 (翻轉)</button>
          <button type="button" class="game-btn" data-game="watermelon">🍉 西瓜棋</button>
        </div>
      </div>

      <div class="mode-tabs">
        <button type="button" class="mode-tab active" id="tabAI">單人對戰 AI</button>
        <button type="button" class="mode-tab" id="tabOnline">遠端開房間</button>
      </div>

      <!-- 五子棋專屬規則設定 -->
      <div class="control-row" id="gomokuOptions">
        <div class="control-group">
          <label for="boardSizeSelect">棋盤格數</label>
          <select id="boardSizeSelect">
            <option value="9">9 × 9</option>
            <option value="11">11 × 11</option>
            <option value="13">13 × 13</option>
            <option value="15" selected>15 × 15</option>
            <option value="17">17 × 17</option>
            <option value="19">19 × 19</option>
          </select>
        </div>
        <div class="control-group">
          <label for="targetLinesSelect">獲勝五連線數</label>
          <select id="targetLinesSelect">
            <option value="1" selected>連成 1 條勝</option>
            <option value="2">累積 2 條勝</option>
            <option value="3">累積 3 條勝</option>
            <option value="4">累積 4 條勝</option>
            <option value="5">累積 5 條勝</option>
          </select>
        </div>
      </div>

      <div class="control-row" id="aiSettingsBox">
        <div class="control-group">
          <label for="aiDifficulty">AI 難度</label>
          <select id="aiDifficulty">
            <option value="easy">入門</option>
            <option value="medium" selected>進階</option>
            <option value="hard">大師</option>
          </select>
        </div>
        <div class="control-group">
          <label for="playerColorSelect">執子順序</label>
          <select id="playerColorSelect">
            <option value="1" selected>玩家 1 (先手)</option>
            <option value="2">玩家 2 (後手)</option>
          </select>
        </div>
      </div>

      <div class="online-box hidden" id="onlineSettingsBox">
        <div class="control-group">
          <label>我的房間代碼（分享給朋友）</label>
          <div class="room-id-display">
            <span id="myRoomId">尚未建立</span>
            <button type="button" class="btn btn-warning btn-sm" id="copyLinkBtn" disabled>複製邀請網址</button>
          </div>
        </div>
        <button type="button" class="btn btn-primary" id="createRoomBtn">建立新房間 (當房主)</button>
        <div class="control-group">
          <label for="joinRoomInput">或輸入朋友房號加入</label>
          <div class="join-row">
            <input type="text" id="joinRoomInput" placeholder="輸入房號..." />
            <button type="button" class="btn btn-success" id="joinRoomBtn">加入</button>
          </div>
        </div>
        <div class="status-pill" id="networkStatus">狀態：點擊「建立新房間」或輸入房號加入</div>
      </div>

      <div class="control-row">
        <button type="button" class="btn btn-warning" id="undoBtn">悔棋一步</button>
        <button type="button" class="btn btn-danger" id="restartBtn">重新開局</button>
      </div>
    </aside>

    <!-- 中間棋盤區域 -->
    <main class="board-section">
      <div class="scoreboard-bar">
        <div class="player-indicator">
          <span class="stone-icon" id="turnStoneIcon"></span>
          <span id="turnText">輪到：黑子 (你)</span>
        </div>

        <div class="lines-counter">
          <div class="score-chip">
            <span class="stone-icon" id="p1ScoreIcon" style="width:14px;height:14px;"></span>
            <span id="p1Label">黑子：</span>
            <span class="score-num" id="p1ScoreText">0 / 1</span>
          </div>
          <span style="color:rgba(255,255,255,0.2);">|</span>
          <div class="score-chip">
            <span class="stone-icon" id="p2ScoreIcon" style="width:14px;height:14px;"></span>
            <span id="p2Label">白子：</span>
            <span class="score-num" id="p2ScoreText">0 / 1</span>
          </div>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="boardCanvas" width="600" height="600"></canvas>
        <div class="toast-banner" id="toastBanner">提示訊息</div>
        <div class="win-toast" id="winToast">
          <h2 id="winTitle">黑子獲勝！</h2>
          <p id="winSubtitle">對局結束</p>
          <button type="button" class="btn btn-primary" id="modalRestartBtn">再來一局</button>
        </div>
      </div>
    </main>

    <!-- 右側空白處：動態遊戲規則說明面板 -->
    <aside class="rules-panel" id="rulesPanel">
      <div class="rules-header">
        <span>📖</span>
        <h2 id="rulePanelTitle">五子棋 · 遊戲規則</h2>
      </div>
      <div id="rulePanelContent"></div>
    </aside>
  </div>

  <script src="script.js"></script>
</body>
</html>
