<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON SNAKE | 復古霓虹貪吃蛇</title>
  <style>
    :root {
      --bg-color: #0d0f1a;
      --cabinet-bg: #16192b;
      --screen-bg: #080a12;
      --neon-green: #00ff88;
      --neon-pink: #ff2a85;
      --neon-blue: #00d4ff;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, #1e2442 0%, var(--bg-color) 70%);
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .arcade-cabinet {
      background: var(--cabinet-bg);
      border: 2px solid #2a3052;
      border-radius: 24px;
      padding: 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 25px rgba(0, 212, 255, 0.1);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--neon-blue);
      text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }

    .scoreboard {
      display: flex;
      gap: 14px;
      font-variant-numeric: tabular-nums;
    }

    .score-box {
      background: var(--screen-bg);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid #252b48;
      text-align: right;
    }

    .score-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      display: block;
    }

    .score-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--neon-green);
    }

    .score-value.high {
      color: var(--neon-pink);
    }

    .screen-wrapper {
      position: relative;
      background: var(--screen-bg);
      border-radius: 14px;
      border: 2px solid #283054;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 10, 18, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      transition: opacity 0.2s ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay h2 {
      margin: 0 0 8px;
      font-size: 1.6rem;
      color: var(--neon-pink);
      text-shadow: 0 0 12px rgba(255, 42, 133, 0.6);
    }

    .overlay p {
      margin: 0 0 20px;
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .btn-start {
      background: linear-gradient(135deg, var(--neon-blue), #0077ff);
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-start:active {
      transform: scale(0.95);
    }

    /* 手機與觸控方向鍵 */
    .controls {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 54px);
      gap: 8px;
      justify-content: center;
    }

    .d-btn {
      background: #212642;
      border: 1px solid #323a63;
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 0 #121526;
      transition: transform 0.05s, box-shadow 0.05s;
    }

    .d-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #121526;
      background: #2c3357;
    }

    .d-up { grid-column: 2; grid-row: 1; }
    .d-left { grid-column: 1; grid-row: 2; }
    .d-down { grid-column: 2; grid-row: 2; }
    .d-right { grid-column: 3; grid-row: 2; }

    .hint {
      text-align: center;
      margin-top: 14px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="arcade-cabinet">
    <div class="header">
      <div class="title">NEON SNAKE</div>
      <div class="scoreboard">
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">BEST</span>
          <span class="score-value high" id="highScore">0</span>
        </div>
      </div>
    </div>

    <div class="screen-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlayTitle">NEON SNAKE</h2>
        <p id="overlayDesc">使用鍵盤方向鍵 / WASD<br>或下方虛擬按鍵控制移動</p>
        <button class="btn-start" id="startBtn">開始遊戲</button>
      </div>
    </div>

    <div class="controls">
      <button class="d-btn d-up" data-dir="UP" aria-label="上">▲</button>
      <button class="d-btn d-left" data-dir="LEFT" aria-label="左">◀</button>
      <button class="d-btn d-down" data-dir="DOWN" aria-label="下">▼</button>
      <button class="d-btn d-right" data-dir="RIGHT" aria-label="右">▶</button>
    </div>

    <div class="hint">按空白鍵 (Space) 可隨時暫停或重新開始</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtn = document.getElementById('startBtn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;
    const STORAGE_KEY = 'neon_snake_best_score';

    let snake = [];
    let food = { x: 10, y: 10 };
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
    let score = 0;
    let highScore = Number(localStorage.getItem(STORAGE_KEY)) || 0;
    let gameLoop = null;
    let speed = 130;
    let isRunning = false;
    let isPaused = false;

    highScoreEl.textContent = highScore;

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1;
      dy = 0;
      nextDx = 1;
      nextDy = 0;
      score = 0;
      speed = 130;
      isPaused = false;
      scoreEl.textContent = score;
      spawnFood();
    }

    function spawnFood() {
      while (true) {
        food = {
          x: Math.floor(Math.random() * TILE_COUNT),
          y: Math.floor(Math.random() * TILE_COUNT)
        };
        const onSnake = snake.some(part => part.x === food.x && part.y === food.y);
        if (!onSnake) break;
      }
    }

    function startGame() {
      initGame();
      isRunning = true;
      overlay.classList.add('hidden');
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      if (score > highScore) {
        highScore = score;
        localStorage.setItem(STORAGE_KEY, highScore);
        highScoreEl.textContent = highScore;
      }
      overlayTitle.textContent = 'GAME OVER';
      overlayDesc.innerHTML = `最終得分：<strong>${score}</strong> 分<br>最高紀錄：${highScore} 分`;
      startBtn.textContent = '再玩一次';
      overlay.classList.remove('hidden');
    }

    function tick() {
      if (isPaused) return;

      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // 撞牆判定
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        return gameOver();
      }

      // 撞到自己判定
      if (snake.some(part => part.x === head.x && part.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      // 吃到食物
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        spawnFood();

        // 隨著分數微幅加速
        if (speed > 65) {
          speed -= 2;
          clearInterval(gameLoop);
          gameLoop = setInterval(tick, speed);
        }
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // 清空背景
      ctx.fillStyle = '#080a12';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 繪製微弱網格線
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // 繪製食物 (發光粉紅圓點)
      ctx.save();
      ctx.shadowColor = '#ff2a85';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ff2a85';
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2.4,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.restore();

      // 繪製蛇身
      snake.forEach((part, index) => {
        const isHead = index === 0;
        ctx.save();
        if (isHead) {
          ctx.shadowColor = '#00ff88';
          ctx.shadowBlur = 10;
          ctx.fillStyle = '#00ff88';
        } else {
          ctx.fillStyle = index % 2 === 0 ? '#00cc6d' : '#00b35f';
        }
        ctx.beginPath();
        ctx.roundRect(
          part.x * GRID_SIZE + 1.5,
          part.y * GRID_SIZE + 1.5,
          GRID_SIZE - 3,
          GRID_SIZE - 3,
          isHead ? 6 : 4
        );
        ctx.fill();
        ctx.restore();
      });
    }

    function setDirection(dir) {
      if (!isRunning || isPaused) return;
      if (dir === 'UP' && dy !== 1) { nextDx = 0; nextDy = -1; }
      if (dir === 'DOWN' && dy !== -1) { nextDx = 0; nextDy = 1; }
      if (dir === 'LEFT' && dx !== 1) { nextDx = -1; nextDy = 0; }
      if (dir === 'RIGHT' && dx !== -1) { nextDx = 1; nextDy = 0; }
    }

    // 鍵盤事件
    document.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      if (e.code === 'ArrowUp' || e.code === 'KeyW') setDirection('UP');
      if (e.code === 'ArrowDown' || e.code === 'KeyS') setDirection('DOWN');
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') setDirection('LEFT');
      if (e.code === 'ArrowRight' || e.code === 'KeyD') setDirection('RIGHT');
      if (e.code === 'Space') {
        if (!isRunning) {
          startGame();
        } else {
          isPaused = !isPaused;
        }
      }
    });

    // 觸控與滑鼠方向鍵
    document.querySelectorAll('.d-btn').forEach(btn => {
      btn.addEventListener('click', () => setDirection(btn.dataset.dir));
    });

    startBtn.addEventListener('click', startGame);

    // 初始畫面預覽
    initGame();
    draw();
  </script>
</body>
</html>
